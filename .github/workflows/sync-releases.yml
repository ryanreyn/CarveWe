name: Sync release to LevineLab (gated majors)

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  LAB_REPO: LevineLab/CarveWe
  # Pipe-separated major prefixes to sync: e.g., "v1|v2" or just "v2"
  ALLOWED_MAJORS: "v0|v1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Gate by major version bumps only
        id: gate
        run: |
          TAG="${{ github.event.release.tag_name }}"

          # Must be strict SemVer vX.Y.Z
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not SemVer (vX.Y.Z). Skipping."
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Only sync major version bumps (vX.0.0)
          if [[ ! "$TAG" =~ ^v[0-9]+\.0\.0$ ]]; then
            echo "Tag $TAG is not a major version bump (vX.0.0). Skipping."
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if major version is in allowed list
          if [[ "$TAG" =~ ^(${ALLOWED_MAJORS})\..* ]]; then
            echo "Tag $TAG is a major version bump in allowed list. Syncing!"
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG major not in (${ALLOWED_MAJORS}). Skipping."
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if gated out
        if: steps.gate.outputs.ok != 'true'
        run: exit 0

      - name: Checkout with all tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Configure git with PAT
        run: |
          git config user.name "Ryan Reynolds"
          git config user.email "levinelab-sync@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.LAB_PUSH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Push branch and create PR
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.LAB_PUSH_TOKEN }}
        run: |
          BRANCH="upstream-${TAG}"

          # Push the branch
          git checkout -B "$BRANCH" "$TAG"
          git remote add lab https://github.com/${{ env.LAB_REPO }}.git
          git push lab "$BRANCH" --force

          # Create PR if it doesn't exist
          gh pr list --repo ${{ env.LAB_REPO }} --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q . && {
            echo "PR already exists for $BRANCH"
            exit 0
          }

          gh pr create --repo ${{ env.LAB_REPO }} \
            --head "$BRANCH" \
            --base main \
            --title "Sync upstream $TAG" \
            --body "Automated PR to sync upstream release $TAG from ryanreyn/CarveWe"
